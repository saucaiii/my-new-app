# Critical-risk deploys: human-run, environment-gated, explicit refs (GH-600 Domain 6).
# - Agents may prepare changes; only a human starts this workflow.
# - The "production" environment requires reviewer approval before the job runs.
# - Deploys take an explicit commit SHA or tag, never "latest on a branch".
# - Rollback = run again with the previous good ref (recorded in the summary).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full commit SHA or release tag (v1.2.3) to deploy"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a deploy midway

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Block bots and agents from starting deploys
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_TYPE: ${{ github.event.sender.type }}
        run: |
          if [ "$ACTOR_TYPE" = "Bot" ] || printf '%s' "$ACTOR" | grep -qiE '(\[bot\]$|copilot)'; then
            echo "Deploys must be started by a human. Actor: $ACTOR"; exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve explicit ref
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: |
          if printf '%s' "$REF" | grep -qE '^[0-9a-f]{40}$'; then sha="$REF"
          elif printf '%s' "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then sha="$(git rev-list -n1 "refs/tags/$REF")"
          else echo "Use a full 40-char SHA or a vX.Y.Z tag, not a branch name."; exit 1; fi
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not on main."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production   # pauses here until a required reviewer approves
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Deploy
        run: echo "Deploying ${{ needs.validate.outputs.sha }} (replace with your deploy command)"
      - name: Record deployed ref (rollback evidence)
        run: |
          {
            echo "### Deployed"
            echo "- Ref input: \`${{ inputs.ref }}\`"
            echo "- Commit: \`${{ needs.validate.outputs.sha }}\`"
            echo "- Approved via environment: production"
            echo "- Rollback: rerun this workflow with the previous deployed commit from the last successful run."
          } >> "$GITHUB_STEP_SUMMARY"
