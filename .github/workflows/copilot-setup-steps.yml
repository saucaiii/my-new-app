# Prepares the environment for Copilot's cloud agent (GH-600 Domain 2).
# - The job MUST be named copilot-setup-steps.
# - If a step fails, the remaining steps are skipped and Copilot starts with the environment as-is.
# - The agent's runtime has its own secret boundary: secrets for it go in the
#   "copilot" environment, it does not inherit repository Actions secrets.
# - Network access is limited by the Copilot firewall allowlist (repo settings).
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [ .github/workflows/copilot-setup-steps.yml ]
  pull_request:
    paths: [ .github/workflows/copilot-setup-steps.yml ]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # least privilege for setup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tools the hooks need
        run: |
          command -v jq || sudo apt-get install -y jq
          chmod +x .agent-policy/policy.sh .github/hooks/scripts/*.sh scripts/agent/*.sh
      - name: Verify the environment works before the agent starts
        run: npm test --if-present
